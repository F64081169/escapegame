<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>已讀未回</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  /* Layout: one fixed stage. Scene art bleeds edge to edge; HUD on top, the phone floats in the middle, the dialogue glass sits at the foot. */
  --night:#0d111d;
  --deep:#161b2c;
  --paper:#ece8f3;
  --mist:#9096ae;
  --her:#ffb38b;
  --him:#8daad8;
  --alert:#ff6479;
  --sage:#9fd3b2;
  --glass:rgba(13,17,29,.80);
  --glass-2:rgba(236,232,243,.07);
  --line:rgba(236,232,243,.14);
  --veil:rgba(9,12,22,.94);
  --veil-2:rgba(9,12,22,.55);
  --scrim:rgba(6,8,15,.72);
  --ph-body:#0b0f1a;
  --ph-bar:#10152330;
  --ph-field:#1b2133;
  --c-lei:#ec96c6;
  --c-bei:#f2b75e;
  --c-cat:#f59f52;
  --c-dad:#c3bcab;
  --c-ama:#e0a993;
  --c-nurse:#9fcfd1;
  --accent:var(--her);
  --mine:var(--her);
  --mine-ink:#2b1a10;
  --theirs:#262c40;
  --theirs-ink:var(--paper);
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-story:"LXGW WenKai TC","Kaiti TC","BiauKai","STKaiti",serif;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --box-h:clamp(8.75rem,24vh,11rem);
  color-scheme:dark;
}
body.pov-him{--accent:var(--him);--mine:var(--him);--mine-ink:#0d1626;--theirs:#3b2a25;--theirs-ink:#ffe6d6}

html{height:100%;box-sizing:border-box;background:var(--night)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--night);color:var(--paper);font-family:var(--f-ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{position:relative;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none}
body.at-title .ui,body.at-title #vert{display:none}
.bg{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
#prop{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#vert{position:absolute;right:max(8px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-60%);writing-mode:vertical-rl;font-family:var(--f-display);font-weight:900;font-size:clamp(3.4rem,13vh,8.5rem);letter-spacing:.1em;line-height:1;color:var(--paper);opacity:.075;pointer-events:none;white-space:nowrap}

/* ---------- stage UI ---------- */
.ui{position:absolute;inset:0;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 14px;pointer-events:none}
.ui > *{pointer-events:auto}
#hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;min-height:36px}
#chap{flex:1 1 0;min-width:0;font:600 .86rem var(--f-display);letter-spacing:.14em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.9}
#tools{display:flex;gap:4px;flex:none}
.tool{background:var(--glass);border:1px solid var(--line);font:500 .74rem var(--f-ui);letter-spacing:.12em;padding:6px 10px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.tool:hover{border-color:var(--accent)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--night);border-color:transparent}
#meters{display:flex;gap:14px;flex:1 1 100%;order:3}
#meters[hidden]{display:none}
@media (min-width:780px){#meters{order:0;flex:0 1 420px}}
.meter{flex:1 1 0;min-width:0;display:grid;grid-template-columns:auto minmax(24px,1fr) 2.2ch;align-items:center;gap:7px}
.meter .lb{font:500 .7rem var(--f-ui);letter-spacing:.16em;color:var(--mist)}
.meter .bar{height:4px;border-radius:2px;background:var(--glass-2);overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;background:currentColor;border-radius:2px;transition:width .7s cubic-bezier(.3,.8,.3,1)}
.meter .val{font:600 .7rem var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;color:var(--paper);opacity:.75}
.meter.count{flex:0 0 auto;grid-template-columns:auto auto}
#meters.danger .meter.run{animation:pulse 1s ease-in-out infinite}
#loc{margin-top:8px;display:flex;align-items:center;gap:8px;min-height:1.2em;font:.74rem var(--f-mono),var(--f-ui);letter-spacing:.05em;color:var(--mist)}
#loc:not(:empty)::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}

#mid{position:relative;flex:1 1 auto;min-height:0;display:grid;place-items:center;padding-block:10px}
#toasts{position:absolute;top:6px;left:50%;transform:translateX(-50%);z-index:6;display:flex;flex-direction:column;align-items:center;gap:6px;width:min(420px,100%);pointer-events:none}
.toast{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:12px;padding:7px 14px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;animation:drop .35s ease both;transition:opacity .5s,transform .5s}
.toast.out{opacity:0;transform:translateY(-6px)}
.toast .d{display:flex;gap:12px;font:600 .74rem var(--f-mono)}
.toast .n{font:400 .92rem/1.5 var(--f-story);color:var(--paper)}

/* ---------- phone ---------- */
#phone{position:relative;height:100%;max-height:640px;width:min(372px,100%);background:var(--ph-body);border:1px solid var(--line);border-radius:30px;box-shadow:0 28px 70px rgba(0,0,0,.55),inset 0 0 0 5px rgba(255,255,255,.02);display:flex;flex-direction:column;overflow:hidden;opacity:0;transform:translateY(14px);transition:opacity .35s,transform .35s}
#phone.on{opacity:1;transform:none}
#phone.freeze{animation:freeze .9s ease}
.ph-top{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.ph-back{font-size:1.4rem;line-height:1;color:var(--mist)}
.ph-av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;font:900 .9rem var(--f-display);background:var(--theirs);color:var(--theirs-ink);border:1px solid var(--line)}
.ph-id{display:flex;flex-direction:column;min-width:0}
.ph-id b{font:700 .92rem var(--f-ui);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-id small{font:.66rem var(--f-mono),var(--f-ui);color:var(--accent);min-height:1em}
#thread{flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth}
.row{display:flex;align-items:flex-end;gap:6px;max-width:100%;animation:pop .28s ease both}
.row.me{flex-direction:row-reverse}
.bubble{max-width:76%;padding:8px 12px;border-radius:17px;font:400 .92rem/1.5 var(--f-ui);word-break:break-word;white-space:pre-wrap}
.row.me .bubble{background:var(--mine);color:var(--mine-ink);border-bottom-right-radius:5px}
.row.them .bubble{background:var(--theirs);color:var(--theirs-ink);border-bottom-left-radius:5px}
.meta{flex:none;font:.6rem/1.3 var(--f-mono),var(--f-ui);color:var(--mist);white-space:nowrap}
.row.me .meta{text-align:right}
.bubble.photo{padding:5px;width:min(210px,76%)}
.ph-img{display:block;aspect-ratio:4/3;border-radius:13px;position:relative;overflow:hidden;background:linear-gradient(140deg,#f6d2a8 0%,#e8956f 55%,#7d5470 100%)}
.ph-img i{position:absolute;border-radius:50% 50% 46% 46%}
.ph-img i:first-child{width:40%;height:44%;left:16%;bottom:10%;background:#fff7ee}
.ph-img i:last-child{width:48%;height:38%;right:8%;bottom:4%;background:#f2a24e}
.ph-img i::before,.ph-img i::after{content:"";position:absolute;top:-12%;width:26%;height:30%;background:inherit;clip-path:polygon(50% 0,100% 100%,0 100%)}
.ph-img i::before{left:12%}.ph-img i::after{right:12%}
.ph-cap{display:block;font-size:.72rem;line-height:1.4;padding:6px 5px 2px;opacity:.82}
.row.me .bubble.sticker,.row.them .bubble.sticker{background:transparent;color:var(--paper);padding:2px 4px;text-align:center}
.kao{display:block;font-size:1.55rem;line-height:1.2;white-space:nowrap}
.bubble.typing{display:flex;gap:4px;padding:12px 14px}
.bubble.typing i{width:6px;height:6px;border-radius:50%;background:var(--theirs-ink);opacity:.5;animation:dot 1.1s infinite}
.bubble.typing i:nth-child(2){animation-delay:.15s}.bubble.typing i:nth-child(3){animation-delay:.3s}
.sys{align-self:center;font:.66rem var(--f-mono),var(--f-ui);letter-spacing:.06em;color:var(--mist);background:var(--glass-2);padding:3px 11px;border-radius:999px;animation:pop .28s ease both}
.ph-bottom{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px}
#replies{display:flex;flex-direction:column;gap:6px}
#replies:empty{display:none}
#replies.pair{flex-direction:row}
.ph-input{display:flex;align-items:flex-end;gap:8px}
#pinput{flex:1 1 auto;min-width:0;min-height:36px;max-height:7.6em;overflow-y:auto;background:var(--ph-field);border-radius:18px;padding:8px 14px;font:400 .9rem/1.5 var(--f-ui);white-space:pre-wrap;word-break:break-word}
#pinput.empty::before{content:"Aa";color:var(--mist)}
#pinput:not(.empty)::after{content:"";display:inline-block;width:2px;height:1.05em;margin-left:1px;vertical-align:-.18em;background:var(--accent);animation:blink 1s steps(1) infinite}
.ph-send{flex:none;width:36px;height:36px;border-radius:50%;background:var(--accent);display:grid;place-items:center;opacity:.3;transition:opacity .2s}
.ph-send::before{content:"";margin-left:3px;border-left:11px solid var(--night);border-top:7px solid transparent;border-bottom:7px solid transparent}
#phone.drafting .ph-send{opacity:1}

/* ---------- choices ---------- */
#choices{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:8px 0;background:radial-gradient(closest-side,var(--scrim),transparent)}
#choices[hidden]{display:none}
.opt{width:min(580px,100%);display:flex;align-items:baseline;gap:12px;text-align:left;cursor:pointer;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:13px 18px;font:400 1.02rem/1.55 var(--f-story);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .2s,border-color .2s,background .2s;animation:rise .4s ease both}
.opt:nth-child(2){animation-delay:.06s}.opt:nth-child(3){animation-delay:.12s}.opt:nth-child(4){animation-delay:.18s}
.opt:hover,.opt:focus-visible{border-color:var(--accent);transform:translateX(4px);outline:none}
.opt .k{flex:none;font:600 .7rem var(--f-mono);color:var(--accent)}
.opt .t{flex:1 1 auto;min-width:0}
.opt.tempt{animation:tempt 1.6s ease-in-out infinite}
.opt.reply{font:400 .88rem/1.45 var(--f-ui);padding:9px 12px;border-radius:14px;background:var(--glass-2)}
.opt.reply:hover,.opt.reply:focus-visible{transform:none;background:var(--ph-field)}
.opt.draft{justify-content:center;align-items:center;font:600 .88rem var(--f-ui);padding:10px 12px}
.opt.draft.send{border-color:var(--accent)}
.opt.draft .req{font:500 .66rem var(--f-mono);color:var(--mist);margin-left:6px}
.opt.draft.short .req{color:var(--alert)}
.opt.draft:hover,.opt.draft:focus-visible{transform:none}

/* ---------- dialogue box ---------- */
#box{position:relative;flex:none;height:var(--box-h);margin-top:6px;padding:1.55rem 1.3rem .9rem;background:var(--glass);border:1px solid var(--line);border-radius:4px 18px 18px 18px;backdrop-filter:blur(14px) saturate(1.1);-webkit-backdrop-filter:blur(14px) saturate(1.1);cursor:pointer;transition:opacity .3s}
#box.idle{opacity:.38}
#who{position:absolute;top:-15px;left:12px;display:flex;align-items:center;gap:6px}
#who[hidden]{display:none}
#who .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:900 .9rem var(--f-display);color:var(--night);background:var(--c,var(--paper))}
#who .av:empty{display:none}
#who .nm{font:700 .8rem var(--f-ui);letter-spacing:.14em;padding:4px 11px;border-radius:999px;background:var(--night);border:1px solid var(--line);color:var(--c,var(--paper))}
#text{height:100%;overflow-y:auto;max-width:46em;font:400 clamp(1rem,2.3vw,1.16rem)/1.85 var(--f-story);letter-spacing:.03em;white-space:pre-wrap}
#box.narr #text{color:var(--paper);opacity:.92}
#box.thought #text{color:var(--accent)}
#box.ready::after{content:"";position:absolute;right:16px;bottom:12px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--accent);animation:bob 1s ease-in-out infinite}

/* ---------- overlays ---------- */
.overlay{position:absolute;inset:0;z-index:20}
.overlay[hidden]{display:none}
.gutter{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}

#card{background:var(--night);display:flex;align-items:flex-end;cursor:pointer;padding-block:32px 13vh}
.c-in{display:flex;flex-direction:column;gap:14px;max-width:42rem}
.c-part{font:500 .76rem var(--f-ui);letter-spacing:.34em;color:var(--accent)}
.c-no{font:600 .95rem var(--f-display);letter-spacing:.32em;color:var(--mist)}
.c-title{margin:0;font:900 clamp(2.1rem,7vw,4.2rem)/1.18 var(--f-display);letter-spacing:.04em;text-wrap:balance}
.c-rule{width:52px;height:2px;background:var(--accent);transform-origin:left}
.c-q{margin:0;font:400 clamp(1rem,2.4vw,1.2rem)/1.7 var(--f-story);color:var(--mist)}
.c-hint{margin-top:16px;font:.7rem var(--f-mono),var(--f-ui);letter-spacing:.24em;color:var(--mist);opacity:.7}
#card.on .c-in > *{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
#card.on .c-in > :nth-child(2){animation-delay:.1s}
#card.on .c-in > :nth-child(3){animation-delay:.2s}
#card.on .c-in > :nth-child(4){animation:grow .8s .45s cubic-bezier(.2,.7,.2,1) both}
#card.on .c-in > :nth-child(5){animation-delay:.6s}
#card.on .c-in > :nth-child(6){animation-delay:1.1s}

#title{background:linear-gradient(100deg,var(--veil) 0%,var(--veil-2) 62%,transparent 100%);overflow-y:auto}
.t-wrap{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:24px;padding-block:36px}
.t-copy{display:flex;flex-direction:column;gap:22px;max-width:30rem}
.t-eyebrow{margin:0;font:500 .78rem var(--f-ui);letter-spacing:.3em;color:var(--her)}
.t-chat{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.t-line{display:flex;align-items:flex-end;gap:8px}
.t-bubble{background:var(--her);color:var(--mine-ink);font:500 1rem var(--f-ui);padding:9px 15px;border-radius:18px 18px 5px 18px;animation:pop .5s .3s ease both}
.t-meta{font:.64rem/1.3 var(--f-mono),var(--f-ui);color:var(--mist);text-align:right;animation:fade .6s 1.3s ease both}
.t-typing{font:.7rem var(--f-mono),var(--f-ui);color:var(--mist);letter-spacing:.08em;animation:ghost 6s 2.4s infinite both}
.t-title{margin:0;display:flex;gap:.08em;writing-mode:vertical-rl;font:900 clamp(5rem,18vh,11rem)/1 var(--f-display);letter-spacing:.06em}
.t-title span:last-child{color:transparent;-webkit-text-stroke:1.5px var(--her)}
.t-menu{display:flex;flex-direction:column;align-items:flex-start}
.t-menu button{background:none;border:0;border-bottom:1px solid var(--line);width:100%;text-align:left;padding:12px 2px;cursor:pointer;font:600 1.1rem var(--f-display);letter-spacing:.12em;display:flex;justify-content:space-between;align-items:baseline;gap:12px;transition:color .2s,padding .2s}
.t-menu button small{font:500 .7rem var(--f-mono),var(--f-ui);letter-spacing:.06em;color:var(--mist);text-align:right}
.t-menu button:hover,.t-menu button:focus-visible{color:var(--her);padding-left:8px;outline:none}
.t-menu button.primary{color:var(--her)}
.t-menu button[hidden]{display:none}
.t-foot{margin:0;font:400 .9rem/1.7 var(--f-story);color:var(--mist)}
@media (max-width:700px){
  .t-wrap{grid-template-columns:minmax(0,1fr);align-content:center}
  .t-title{writing-mode:horizontal-tb;order:-1;font-size:clamp(3.6rem,19vw,5.4rem)}
}

#ending{background:radial-gradient(110% 70% at 0% 100%,var(--glow,var(--glass-2)) 0%,transparent 60%),var(--night);overflow-y:auto}
.e-wrap{max-width:44rem;display:flex;flex-direction:column;gap:18px;padding-block:52px 44px}
.e-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.e-rank{font:600 .72rem var(--f-mono);letter-spacing:.24em;padding:5px 11px;border-radius:999px;color:var(--night);background:var(--glow-solid,var(--paper))}
.e-no{font:500 .72rem var(--f-mono);letter-spacing:.2em;color:var(--mist);font-variant-numeric:tabular-nums}
.e-title{margin:0;font:900 clamp(2.4rem,8vw,4.6rem)/1.12 var(--f-display);letter-spacing:.04em;text-wrap:balance}
.e-text{margin:0;font:400 clamp(1.02rem,2.3vw,1.18rem)/1.9 var(--f-story);max-width:36em}
.e-draft{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--glass-2);display:flex;flex-direction:column;gap:4px;max-width:30rem}
.e-draft .lb{font:500 .68rem var(--f-ui);letter-spacing:.24em;color:var(--him)}
.e-draft time{font:.66rem var(--f-mono);color:var(--mist)}
.e-draft p{margin:0;font:400 1rem/1.6 var(--f-ui)}
.e-draft p::after{content:"";display:inline-block;width:2px;height:1em;margin-left:2px;vertical-align:-.15em;background:var(--him);animation:blink 1s steps(1) infinite}
.e-stats{display:flex;gap:18px;flex-wrap:wrap;font:500 .74rem var(--f-mono);color:var(--mist)}
.e-stats b{color:var(--paper);font-weight:600}
.e-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn{cursor:pointer;border-radius:999px;border:1px solid var(--line);background:var(--glass-2);padding:11px 18px;font:600 .88rem var(--f-ui);letter-spacing:.1em;transition:border-color .2s,background .2s}
.btn:hover,.btn:focus-visible{border-color:var(--accent);outline:none}
.btn.primary{background:var(--accent);color:var(--night);border-color:transparent}
.e-about{margin-top:18px;padding-top:22px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.e-about h3{margin:0;font:600 1rem var(--f-display);letter-spacing:.14em}
.e-about p{margin:0;font:400 .98rem/1.85 var(--f-story);color:var(--paper);opacity:.88;max-width:36em}
.e-about .bye{color:var(--accent);opacity:1}

/* ---------- modal ---------- */
.modal{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:var(--scrim);padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal[hidden]{display:none}
.sheet{width:min(560px,100%);max-height:100%;overflow-y:auto;background:var(--deep);border:1px solid var(--line);border-radius:20px;padding:24px 22px;box-shadow:0 30px 80px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:14px;animation:rise .3s ease both;user-select:text;-webkit-user-select:text}
.m-eyebrow{margin:0;font:500 .7rem var(--f-ui);letter-spacing:.28em;color:var(--accent)}
.m-title{margin:0;font:900 1.5rem/1.3 var(--f-display);letter-spacing:.04em}
.m-note{margin:0;font:400 .9rem/1.7 var(--f-story);color:var(--mist)}
.m-input{width:100%;background:var(--ph-field);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:600 1.3rem var(--f-display);letter-spacing:.1em;color:var(--paper)}
.m-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.m-close{align-self:flex-start}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:8px 14px;cursor:pointer;font:500 .82rem var(--f-ui);letter-spacing:.08em}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--night)}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:6px;border-bottom:1px solid var(--line)}
.set-row > span{font:500 .9rem var(--f-ui);letter-spacing:.08em}
.parts{display:flex;flex-direction:column;gap:10px}
.part{display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer;background:var(--glass-2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;transition:border-color .2s}
.part:hover:not([disabled]),.part:focus-visible{border-color:var(--accent);outline:none}
.part b{font:900 1.1rem var(--f-display);letter-spacing:.08em}
.part span{font:400 .92rem/1.6 var(--f-story);color:var(--mist)}
.part small{font:500 .68rem var(--f-mono),var(--f-ui);letter-spacing:.1em;color:var(--accent)}
.part[disabled]{cursor:not-allowed;opacity:.5}
.linkish{background:none;border:0;padding:4px 0;cursor:pointer;font:.78rem var(--f-ui);color:var(--mist);text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:0;margin:0;list-style:none}
.gallery li{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--glass-2)}
.gallery .no{font:500 .64rem var(--f-mono);letter-spacing:.14em;color:var(--mist)}
.gallery b{font:900 .98rem/1.35 var(--f-display)}
.gallery .rk{font:600 .6rem var(--f-mono);letter-spacing:.14em}
.gallery li.locked b{color:var(--mist)}
.log{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.log li{display:flex;flex-direction:column;gap:2px}
.log .w{font:700 .72rem var(--f-ui);letter-spacing:.12em}
.log .x{font:400 .95rem/1.7 var(--f-story)}
.log li.pick .x{color:var(--accent)}
.drafts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.drafts li{border-left:2px solid var(--him);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:2px}
.drafts time{font:.64rem var(--f-mono);color:var(--mist)}
.drafts p{margin:0;font:400 .95rem/1.6 var(--f-ui)}
.drafts .tag{font:600 .62rem var(--f-mono);letter-spacing:.1em;color:var(--sage)}
.drafts li.sent{border-left-color:var(--sage)}

/* ---------- scene props ---------- */
.neon{position:absolute;top:24%;left:7%;font:900 clamp(1.3rem,4.2vw,2.4rem) var(--f-display);letter-spacing:.12em;color:#ffe2cf;text-shadow:0 0 6px #ff9c7a,0 0 22px #ff5f72;display:flex;align-items:baseline;gap:.1em;white-space:nowrap}
.neon em{font-style:normal;opacity:.8}
.neon b{color:#fff3e8;animation:flick 3.4s infinite}
.neon i{font-style:normal;color:#5a3a45;text-shadow:none;animation:broken 7s infinite}
.bulbs{position:absolute;left:4%;right:4%;top:15%;height:60px}
.bulbs i{position:absolute;width:9px;height:9px;border-radius:50%;background:#ffd796;box-shadow:0 0 12px 3px rgba(255,200,120,.55);transform:translateX(-50%)}
.bulbs i.off{background:#4b3f3a;box-shadow:none}
.lantern{position:absolute;top:-10px;width:clamp(46px,7vw,74px);aspect-ratio:3/4;border-radius:44%;background:radial-gradient(circle at 50% 45%,#ff6a4d,#c21f2c 70%);box-shadow:0 0 40px rgba(255,80,60,.45);transform-origin:50% -40px;animation:sway 4s ease-in-out infinite}
.lantern::before,.lantern::after{content:"";position:absolute;left:28%;right:28%;height:9%;background:#e8b34a;border-radius:3px}
.lantern::before{top:-4%}.lantern::after{bottom:-4%}
.lantern.l1{left:9%}.lantern.l2{left:26%;top:-30px;animation-delay:-1.6s}
.skyline{position:absolute;left:0;right:0;bottom:0;height:42%;background:radial-gradient(circle,rgba(255,214,150,.55) 0 1px,transparent 1.6px) 0 0/10px 13px,#090a17;clip-path:polygon(0 60%,6% 60%,6% 34%,12% 34%,12% 50%,17% 50%,17% 18%,22% 18%,22% 44%,29% 44%,29% 26%,33% 26%,33% 8%,36% 8%,36% 40%,44% 40%,44% 22%,51% 22%,51% 52%,57% 52%,57% 14%,61% 14%,61% 4%,63% 4%,63% 36%,70% 36%,70% 28%,76% 28%,76% 48%,82% 48%,82% 20%,88% 20%,88% 42%,94% 42%,94% 30%,100% 30%,100% 100%,0 100%);opacity:.9}
.tube{position:absolute;top:6%;left:30%;right:30%;height:6px;border-radius:3px;background:#eafcff;box-shadow:0 0 30px 8px rgba(200,240,255,.35);animation:tube 5s infinite}
.lamp{position:absolute;top:-120px;left:50%;width:420px;height:420px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,226,170,.22),transparent 65%)}

/* ---------- motion ---------- */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
@keyframes blink{50%{opacity:0}}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:.9}}
@keyframes pulse{50%{opacity:.45}}
@keyframes tempt{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px) rotate(-.4deg)}40%{transform:translateX(3px) rotate(.4deg)}60%{transform:translateX(-2px)}}
@keyframes freeze{0%,100%{transform:none}15%{transform:translateX(-4px)}30%{transform:translateX(4px)}45%{transform:translateX(-3px)}60%{transform:translateX(2px)}}
@keyframes ghost{0%,8%{opacity:0}12%,40%{opacity:1}46%,100%{opacity:0}}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.2}95%{opacity:1}97%{opacity:.4}}
@keyframes broken{0%,96%,100%{color:#5a3a45;text-shadow:none}97%{color:#ffe2cf;text-shadow:0 0 14px #ff5f72}98%{color:#5a3a45;text-shadow:none}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes tube{0%,90%,100%{opacity:1}91%{opacity:.3}93%{opacity:1}95%{opacity:.5}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="app">
  <div class="bg" id="bgA"></div>
  <div class="bg" id="bgB"></div>
  <div id="prop"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="vert" aria-hidden="true"></div>

  <div class="ui" id="ui">
    <header id="hud">
      <div id="chap"></div>
      <div id="tools">
        <button class="tool" id="tLog" type="button">紀錄</button>
        <button class="tool" id="tAuto" type="button" aria-pressed="false">自動</button>
        <button class="tool" id="tSkip" type="button" aria-pressed="false">快轉</button>
        <button class="tool" id="tMenu" type="button">選單</button>
      </div>
      <div id="meters"></div>
    </header>
    <div id="loc"></div>
    <div id="mid">
      <div id="toasts" aria-live="polite"></div>
      <section id="phone" hidden aria-label="手機">
        <div class="ph-top">
          <span class="ph-back" aria-hidden="true">‹</span>
          <span class="ph-av" id="phAv"></span>
          <div class="ph-id"><b id="phName"></b><small id="phStatus"></small></div>
        </div>
        <div id="thread"></div>
        <div class="ph-bottom">
          <div id="replies"></div>
          <div class="ph-input"><div id="pinput" class="empty"></div><span class="ph-send" aria-hidden="true"></span></div>
        </div>
      </section>
      <div id="choices" hidden></div>
    </div>
    <div id="box" class="narr">
      <div id="who" hidden><span class="av"></span><span class="nm"></span></div>
      <div id="text" aria-live="polite"></div>
    </div>
  </div>

  <section id="card" class="overlay gutter" hidden>
    <div class="c-in">
      <div class="c-part"></div>
      <div class="c-no"></div>
      <h2 class="c-title"></h2>
      <div class="c-rule"></div>
      <p class="c-q"></p>
      <div class="c-hint">點擊繼續</div>
    </div>
  </section>

  <section id="title" class="overlay">
    <div class="t-wrap gutter">
      <div class="t-copy">
        <p class="t-eyebrow">攻略逃避型人格戀愛模擬器</p>
        <div class="t-chat" aria-hidden="true">
          <div class="t-line"><span class="t-meta">已讀<br>02:14</span><span class="t-bubble">在嗎？</span></div>
          <span class="t-typing">對方正在輸入…</span>
        </div>
        <nav class="t-menu" aria-label="主選單">
          <button id="bNew" class="primary" type="button">開始新遊戲</button>
          <button id="bCont" type="button" hidden>繼續<small id="bContLabel"></small></button>
          <button id="bParts" type="button">選擇篇章</button>
          <button id="bEnds" type="button">結局收集<small id="bEndsCount"></small></button>
          <button id="bSet" type="button">設定</button>
        </nav>
        <p class="t-foot">三個篇章，十一種結局，和一支總是已讀不回的手機。</p>
      </div>
      <h1 class="t-title"><span>已讀</span><span>未回</span></h1>
    </div>
  </section>

  <section id="ending" class="overlay"  hidden>
    <div class="e-wrap gutter" id="endBody"></div>
  </section>

  <div id="modal" class="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true" id="sheet"></div>
  </div>
</div>

<script src="story/p1a.js"></script>
<script src="story/p1b.js"></script>
<script src="story/p2a.js"></script>
<script src="story/p2b.js"></script>
<script src="story/p3a.js"></script>
<script src="story/p3b.js"></script>
<script src="scene.js"></script>
<script src="engine.js"></script>
</body>
</html>
